# Teaching example only; inactive outside .github/workflows/.
name: Training queue tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test labs/encounter.test.mjs
